<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hisaab Aunty prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:#E8E2D4;color:#1C2B4B;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.stage{display:flex;gap:24px;padding:20px;align-items:flex-start;justify-content:center;min-height:100%}
.phone-col{flex:0 0 auto;position:sticky;top:20px}
.dash-col{flex:1 1 560px;min-width:0;max-width:980px}
@media(max-width:960px){.stage{flex-direction:column;align-items:center;padding:10px}.phone-col{position:static}.dash-col{width:100%}}
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.phone-note{font-size:12px;color:#5A6480;text-align:center;max-width:390px}
/* ---------- phone ---------- */
.phone{--bg:#FBF6EC;--surface:#fff;--sunk:#F3ECDF;--line:#E6DCCB;--ink:#1C2B4B;--on-ink:#FBF6EC;--muted:#5A6480;--saffron:#F39C1E;--saff-text:#8F4D00;--ok:#1D7349;--over:#B3261E;--ok-bg:#E3F3EA;--over-bg:#FBE7E5;
 width:390px;height:min(820px,calc(100vh - 70px));min-height:640px;background:var(--bg);color:var(--ink);border-radius:40px;border:9px solid #0E1630;box-shadow:0 18px 50px rgba(20,30,60,.35);position:relative;overflow:hidden;display:flex;flex-direction:column;font-size:15px}
.phone[data-theme=dark]{--bg:#0F1628;--surface:#18223D;--sunk:#141D35;--line:#2A3658;--ink:#F2EDE3;--on-ink:#0F1628;--muted:#A9B0C3;--saffron:#FFAE45;--saff-text:#FFC27A;--ok:#6FD6A0;--over:#FF8C82;--ok-bg:#16352A;--over-bg:#3D1F25}
.phone *{scrollbar-width:none;-ms-overflow-style:none}.phone *::-webkit-scrollbar{display:none;width:0;height:0}
h1,h2,h3,.big,.num{font-family:'Baloo 2','DM Sans',system-ui,sans-serif;margin:0;font-weight:700}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:5}
.screen.navy{background:#1C2B4B;color:#FBF6EC;align-items:center;justify-content:center}
.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.scroll{overflow-y:auto;flex:1;padding:14px 16px 20px}
.pad{padding:22px}
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:44px;font-weight:600;background:var(--ink);color:var(--on-ink)}
.btn.sec{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:32px;border-radius:10px;font-size:13px}
.btn.saf{background:var(--saffron);color:#1C2B4B}
.btn.danger{background:var(--over);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.lnk{background:none;border:0;padding:0;color:var(--saff-text);text-decoration:underline;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px;color:var(--ink)}
.field input:focus,.field select:focus,.chat-in input:focus{outline:2px solid var(--saffron);outline-offset:1px}
.err{color:var(--over);font-size:13px;min-height:18px;margin:4px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:8px 0;line-height:1.35}
.check input{width:20px;height:20px;margin-top:1px;accent-color:#1C2B4B}
/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);flex:0 0 auto}
.hdr .face{width:44px;height:44px;flex:0 0 44px}
.hdr .ttl{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:19px;line-height:1}
.hdr .sub{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.over{background:var(--over-bg);color:var(--over)}.pill.late{background:var(--over-bg);color:var(--over)}.pill.neutral{background:var(--sunk);color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;font-size:20px}
.panels{flex:1;position:relative;overflow:hidden}
.panel{position:absolute;inset:0;overflow-y:auto;display:none}
.panel.on{display:flex;flex-direction:column}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface);flex:0 0 auto}
.tabbar button{flex:1;border:0;background:none;padding:8px 0 10px;min-height:56px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ti{background:var(--saffron);color:#1C2B4B}
.tabbar .ti{width:44px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:15px}
/* face */
.face{display:block}
.face .brow-l,.face .brow-r,.face .mouth{transition:d .35s ease,transform .35s ease;fill:none;stroke:#1C2B4B;stroke-linecap:round;stroke-width:2.2}
.face .eye{transition:r .3s,cy .3s;fill:#1C2B4B}
.face.m-neutral .brow-l{d:path('M32 38 L47 38')}.face.m-neutral .brow-r{d:path('M53 38 L68 38')}.face.m-neutral .mouth{d:path('M43 65 L57 65')}
.face.m-happy .brow-l{d:path('M32 38 Q39.5 32 47 38')}.face.m-happy .brow-r{d:path('M53 38 Q60.5 32 68 38')}.face.m-happy .mouth{d:path('M39 62 Q50 74 61 62')}.face.m-happy .eye{r:1.6px;cy:49px}
.face.m-judge .brow-l{d:path('M32 33 Q40 30 47 36')}.face.m-judge .brow-r{d:path('M53 41 L68 37')}.face.m-judge .mouth{d:path('M42 66 Q50 61 59 65')}
.face.m-shock .brow-l{d:path('M32 32 Q39.5 27 47 32')}.face.m-shock .brow-r{d:path('M53 32 Q60.5 27 68 32')}.face.m-shock .mouth{d:path('M45 63 Q50 74 55 63 Q50 60 45 63Z');fill:#7A2E2E}.face.m-shock .eye{r:3.4px}
.face .eye{r:2.4px}
.rm .face *{transition:none!important}
/* gauge */
.gauge-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px;text-align:center}
.gauge{width:100%;max-width:280px;margin:0 auto;display:block}
.gauge .track{fill:none;stroke:var(--sunk);stroke-width:18;stroke-linecap:round}
.gauge .fill{fill:none;stroke:var(--saffron);stroke-width:18;stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),stroke .3s}
.gauge.over .fill{stroke:var(--over)}
.rm .gauge .fill{transition:none}
.big{font-size:44px;line-height:1;margin-top:-52px;position:relative}
.gauge-lbl{font-size:14px;color:var(--muted);margin-top:2px}
.gauge-sub{font-size:13px;color:var(--muted);margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.card h3{font-size:15px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;line-height:1.1;margin:2px 0 4px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--saffron);border-radius:99px;transition:width .8s}
.bar.over>i{background:var(--over)}
.cat-row{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.spend-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);animation:slide .35s both}
.spend-row:first-child{border-top:0}
.chip-cat{font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--sunk);color:var(--saff-text);white-space:nowrap}
.x{border:0;background:var(--sunk);border-radius:99px;width:32px;height:32px;color:var(--muted);font-size:15px;flex:0 0 32px}
.empty{color:var(--muted);text-align:center;padding:14px 6px;font-size:13px}
.nudge{background:linear-gradient(135deg,var(--surface),var(--sunk));border-left:4px solid var(--saffron)}
.insight{border-left:4px solid var(--ok)}
/* chat */
.feed{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:9px 13px;border-radius:18px;line-height:1.38;animation:slide .3s both;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.a.nudgemsg{border-left:4px solid var(--saffron)}
.msg .undo{display:block;margin-top:6px}
.msg .meta{font-size:11px;color:var(--muted);margin-top:4px}
.msg.fail{opacity:.85;border:1px dashed var(--over)}
.typing{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:11px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.rm .typing i{animation:none}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rm .msg,.rm .spend-row{animation:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 14px;flex:0 0 auto}
.chips button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;min-height:36px;font-size:13px}
.chat-in{display:flex;gap:8px;padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--bg);flex:0 0 auto}
.chat-in input{flex:1;background:var(--sunk);border:1px solid var(--line);border-radius:22px;padding:0 16px;min-height:44px;color:var(--ink)}
.chat-in .btn{border-radius:22px;padding:0 16px}
.chat-in .mic{width:44px;border-radius:50%;padding:0;background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.chat-in .mic.rec{background:var(--over);color:#fff}
.offline-note{background:var(--over-bg);color:var(--over);font-size:12px;font-weight:600;padding:6px 14px;text-align:center}
/* overlays */
.sheet-bg{position:absolute;inset:0;background:rgba(10,15,30,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:18px;max-height:92%;overflow-y:auto;animation:slide .25s both}
.toast{position:absolute;left:12px;right:12px;bottom:76px;background:var(--ink);color:var(--on-ink);border-radius:14px;padding:11px 14px;z-index:30;display:flex;gap:10px;align-items:center;animation:slide .25s both}
.toast .lnk{color:var(--saffron)}
.push{position:absolute;left:10px;right:10px;top:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;animation:slide .3s both}
.push b{font-size:12px;color:var(--saff-text)}
.lock{position:absolute;inset:0;background:#1C2B4B;z-index:60;color:#FBF6EC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(820px) rotate(540deg);opacity:.2}}
.settings h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 2px 6px;font-family:'DM Sans',sans-serif;font-weight:700}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-height:48px}
.srow:first-child{border-top:0}
.srow select,.srow input[type=time],.srow input[type=number]{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:36px}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;border:0;flex:0 0 46px}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--ok)}.switch.on::after{left:21px}
.badge{font-size:10px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--sunk);color:var(--saff-text);margin-left:6px}
.widget{width:170px;height:80px;border-radius:20px;background:#1C2B4B;color:#FBF6EC;padding:10px 12px;display:flex;gap:8px;align-items:center;cursor:pointer}
.widget .face{width:38px;height:38px}
/* ---------- dashboard ---------- */
.dash{background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(20,30,60,.12);overflow:hidden}
.dash-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #EEE7D8;flex-wrap:wrap}
.dash-hd h1{font-size:22px}
.dtabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid #EEE7D8;flex-wrap:wrap;background:#FBF8F1}
.dtabs button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:600;color:#5A6480}
.dtabs button.on{background:#1C2B4B;color:#fff}
.dbody{padding:16px 18px;max-height:calc(100vh - 170px);overflow:auto}
.dbody h3{font-size:16px;margin:16px 0 8px}
.dbody h3:first-child{margin-top:0}
.dbtn{border:1px solid #D9D0BC;background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;margin:3px 6px 3px 0}
.dbtn:hover{background:#F3ECDF}.dbtn.pri{background:#1C2B4B;color:#fff;border-color:#1C2B4B}.dbtn.warn{background:#B3261E;color:#fff;border-color:#B3261E}
.dtable{border-collapse:collapse;width:100%;font-size:12px}
.dtable th,.dtable td{border-bottom:1px solid #EEE7D8;padding:5px 8px;text-align:left;vertical-align:top;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.dtable th{background:#FBF8F1;position:sticky;top:0;font-weight:700;color:#5A6480}
.dtable td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-height:420px;border:1px solid #EEE7D8;border-radius:10px}
.kv{display:grid;grid-template-columns:200px 1fr 1fr;gap:4px 12px;font-size:13px}
.kv div{padding:4px 0;border-bottom:1px solid #F3EEE2}
.kv .h{font-weight:700;color:#5A6480}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:12px}
pre{background:#F6F2E8;border-radius:10px;padding:10px;overflow:auto;max-height:340px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.ok{color:#1D7349;font-weight:700}.bad{color:#B3261E;font-weight:700}.warn{color:#8F4D00;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#F3ECDF;color:#8F4D00;margin-right:4px}
.tag.g{background:#E3F3EA;color:#1D7349}.tag.r{background:#FBE7E5;color:#B3261E}
.ctl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F3EEE2}
.ctl .d{flex:1}.ctl .d small{display:block;color:#5A6480}
.dash input,.dash select,.dash textarea{border:1px solid #D9D0BC;border-radius:8px;padding:6px 8px;background:#fff}
.dash textarea{width:100%;min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.sw{width:42px;height:24px;border-radius:99px;background:#CFC6B2;border:0;position:relative;flex:0 0 42px}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:#1D7349}.sw.on::after{left:21px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.cols{grid-template-columns:1fr}.kv{grid-template-columns:1fr 1fr}}
.rm-note{display:none}
@media(prefers-reduced-motion:reduce){.phone[data-rm=system] *{animation:none!important;transition:none!important}}
/* ---------- ledger, floating +, sheets ---------- */
.okc{color:var(--ok)}.overc{color:var(--over)}
.fab{position:absolute;right:16px;bottom:72px;width:56px;height:56px;border-radius:50%;border:0;background:var(--saffron);color:#1C2B4B;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:15;align-items:center;justify-content:center;padding:0 0 3px}
.lhead{display:flex;align-items:center;gap:2px;padding:6px 8px 2px;position:relative}
.ltitle{background:none;border:0;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:20px;padding:4px 6px;min-height:44px;color:var(--ink)}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:700;min-height:36px;color:var(--ink)}
.menu-wrap{position:relative}.menu{position:absolute;right:0;top:42px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:12;padding:6px;min-width:140px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;min-height:40px}.menu button.on{background:var(--sunk);font-weight:700}
.lsum{display:flex;gap:10px;padding:8px 14px 2px}
.spill{flex:1;display:flex;align-items:center;gap:10px;border-radius:99px;padding:8px 14px 8px 8px;border:1px solid var(--line)}
.spill .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.spill .k{font-size:11px;font-weight:700;color:var(--muted)}.spill .v{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;line-height:1.05}
.spill.inc{background:var(--ok-bg)}.spill.inc .ic{background:var(--ok);color:var(--bg)}.spill.exp{background:var(--over-bg)}.spill.exp .ic{background:var(--over);color:var(--bg)}
.lnet{text-align:center;padding:6px 14px 4px}
.lsearch{padding:4px 14px}.lsearch input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:40px;color:var(--ink)}
#lList{padding:4px 14px 90px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:10px;overflow:hidden}
.dcard summary{list-style:none;cursor:pointer}.dcard summary::-webkit-details-marker{display:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--sunk);font-weight:700;font-size:13px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:56px}
.lrow:hover{background:var(--sunk)}
.lic{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 40px}.lic.income{background:var(--ok-bg)}
.lt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.amt{font-family:'Baloo 2',sans-serif;font-size:16px;white-space:nowrap}
.lim .cat-row{grid-template-columns:110px 1fr auto}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;border:1px solid var(--line)}.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;min-height:34px}.seg button.on{background:var(--ink);color:var(--on-ink)}

<script>// ==LOGIC==
// Hisaab Aunty money logic. Pure functions, no I/O. Lift this block into packages/core.
// Amounts here are rupees (numbers). The database stores integer paise; conversion happens in the backend.
const DPM = 30.4375;          // days per month used for goal maths
const MIN_MONTHS = 0.25;      // so a goal due tomorrow does not divide by zero
const ONTIME_DAYS = 3;        // on time when projected delay <= 3 days
const CATS = ['food', 'chai', 'ride', 'shop', 'other'];
const CAT_LABEL = { food: 'Food delivery', chai: 'Chai & coffee', ride: 'Auto & cab', shop: 'Shopping', other: 'Other' };

// ---------- formatting ----------
function groupIN(intStr) {
  const last3 = intStr.slice(-3), rest = intStr.slice(0, -3);
  return rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
}
function fmtINR(n, dec) {
  n = Number(n); const neg = n < 0; n = Math.abs(n);
  const s = dec ? n.toFixed(dec) : String(Math.round(n));
  const [i, d] = s.split('.');
  return (neg ? '-' : '') + '₹' + groupIN(i) + (d ? '.' + d : '');
}
const round1 = x => Math.round(x * 10) / 10;
const daysTxt = x => { const r = round1(Math.abs(x)); return (r === 1 ? '1 day' : r + ' days'); };
const toPaise = r => Math.round(r * 100);
const toRupees = p => p / 100;

// ---------- dates (all "day keys" are YYYY-MM-DD in the user's timezone) ----------
function dayKey(ms, tz) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz || 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' }).format(ms);
}
const dkToDays = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
const daysToDk = n => new Date(Math.round(n) * 86400000).toISOString().slice(0, 10);
const addDays = (k, n) => daysToDk(dkToDays(k) + n);
const diffDays = (a, b) => dkToDays(a) - dkToDays(b);
const daysInMonth = k => { const [y, m] = k.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const dow = k => new Date(dkToDays(k) * 86400000).getUTCDay();            // 0 = Sunday
const weekStartMon = k => addDays(k, -((dow(k) + 6) % 7));
const WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
function tzOffsetMin(tz, ms) {
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(ms);
  const g = {}; parts.forEach(p => g[p.type] = p.value);
  const asUTC = Date.UTC(+g.year, +g.month - 1, +g.day, +g.hour, +g.minute, +g.second);
  return Math.round((asUTC - Math.floor(ms / 1000) * 1000) / 60000);
}
function localToMs(dk, hh, mm, tz) {
  const [y, m, d] = dk.split('-').map(Number);
  const guess = Date.UTC(y, m - 1, d, hh, mm);
  return guess - tzOffsetMin(tz || 'Asia/Kolkata', guess) * 60000;
}
function hmOf(ms, tz) {
  return new Intl.DateTimeFormat('en-GB', { timeZone: tz || 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(ms);
}
const hmToMin = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
function inQuietHours(hm, start, end) {   // handles ranges that cross midnight (22:00 to 08:00)
  const t = hmToMin(hm), s = hmToMin(start), e = hmToMin(end);
  return s <= e ? (t >= s && t < e) : (t >= s || t < e);
}
const monthsToDeadline = (today, months) => addDays(today, Math.round(months * DPM));

// ---------- the core calculations ----------
// s = { income, today, spends:[{amount, category, dk}], and either goals:[{name, cost, deadline}] or a single cost + deadline }
// With no goals the app is a plain daily budgeter: free income spread over the days of the month.
// With several goals, the monthly saving needed is the sum, and savings are shared in proportion, so an overspend
// delays every goal by the same number of days: amount / (total required per day).
function etaFor(per, projSave, reqPerMonth, today) {
  const out = per.map(g => {
    const share = projSave > 0 && reqPerMonth > 0 ? projSave * g.req / reqPerMonth : 0;
    const etaDays = share > 0 ? g.cost / share * DPM : Infinity;
    const delay = isFinite(etaDays) ? Math.round(etaDays - g.daysLeft) : null;
    return Object.assign({}, g, { share, etaDays, etaDate: isFinite(etaDays) ? addDays(today, Math.round(etaDays)) : null, delayDays: delay, never: !isFinite(etaDays), onTime: isFinite(etaDays) && delay <= ONTIME_DAYS });
  });
  return out;
}
function derive(s) {
  const today = s.today, dim = daysInMonth(today), dom = +today.slice(8);
  const gl = s.goals ? s.goals : (s.cost > 0 ? [{ name: s.name || 'Goal', cost: s.cost, deadline: s.deadline }] : []);
  const base = gl.map(g => { const daysLeft = diffDays(g.deadline, today), monthsLeft = Math.max(MIN_MONTHS, daysLeft / DPM); return Object.assign({}, g, { daysLeft, monthsLeft, req: g.cost / monthsLeft }); });
  const reqPerMonth = base.reduce((a, g) => a + g.req, 0);
  const reqPerDay = reqPerMonth / DPM;
  const first = base[0] || { daysLeft: 0, monthsLeft: 0 };
  const free = s.income - reqPerMonth;
  const dailyBudget = Math.max(0, free / dim);
  const monthBudget = Math.max(0, free);
  const sum = (fn) => s.spends.reduce((a, x) => fn(x) ? a + x.amount : a, 0);
  const spentToday = sum(x => x.dk === today);
  const leftToday = dailyBudget - spentToday;
  const weekFrom = addDays(today, -6);
  const weekTotal = sum(x => x.dk >= weekFrom && x.dk <= today);
  const weekBudget = dailyBudget * 7;
  const mp = today.slice(0, 7);
  const spentMTD = sum(x => x.dk.slice(0, 7) === mp && x.dk <= today);
  const projSpend = dom < 4 ? monthBudget : spentMTD + (spentMTD / dom) * (dim - dom);
  const projSave = s.income - projSpend;
  const hasGoals = base.length > 0;
  const goals = etaFor(base, projSave, reqPerMonth, today);
  const never = hasGoals && goals.some(g => g.never);
  const worst = goals.filter(g => !g.never).sort((x, y) => y.delayDays - x.delayDays)[0];
  const etaMonths = !hasGoals || never ? (hasGoals ? Infinity : null) : goals[0].etaDays / DPM;
  const delayDays = !hasGoals || never ? null : worst.delayDays;
  const etaDate = !hasGoals || never ? null : worst.etaDate;
  const onTime = hasGoals ? goals.every(g => g.onTime) : true;
  return {
    daysLeft: first.daysLeft, monthsLeft: first.monthsLeft, reqPerMonth, reqPerDay, free, dailyBudget, monthBudget, spentToday, leftToday,
    weekTotal, weekBudget, spentMTD, projSpend, projSave, etaMonths, etaDate, delayDays, onTime, never, hasGoals, goals,
    dom, dim, deadlinePassed: base.some(g => g.daysLeft < 0), noBudget: free <= 0,
    goalDays: x => reqPerDay > 0 ? x / reqPerDay : 0,
  };
}
// after an overspend: what to spend per day for the rest of the month to land back on plan
function recoveryPlan(d) {
  const remainingDays = d.dim - d.dom, remaining = d.monthBudget - d.spentMTD;
  const newDaily = remainingDays > 0 ? Math.max(0, remaining / remainingDays) : null;
  return { remainingDays, remaining, newDaily, normalDaily: d.dailyBudget, cutPerDay: newDaily == null ? null : Math.max(0, d.dailyBudget - newDaily) };
}
function verdict(a, d) {
  const left = d.leftToday;
  if (a <= 0.7 * left) return { verdict: 'yes', over: 0, goalDays: 0 };
  if (a <= left) return { verdict: 'meh', over: 0, goalDays: 0 };
  const over = a - Math.max(left, 0);
  return { verdict: 'no', over, goalDays: d.goalDays(over) };
}

// ---------- spend parsing (used before the AI, and as the fallback after) ----------
const AMT_RE = /(\d{1,3}(?:,\d{2,3})+(?:\.\d+)?|\d+(?:\.\d+)?)\s*(k|lakh|lacs?|lac|l)?(?![a-z0-9])/ig;
function findAmounts(text) {
  const out = []; let m; AMT_RE.lastIndex = 0;
  while ((m = AMT_RE.exec(text))) {
    let v = parseFloat(m[1].replace(/,/g, ''));
    const suf = (m[2] || '').toLowerCase();
    if (suf === 'k') v *= 1000; else if (suf) v *= 100000;
    out.push({ value: v, index: m.index, end: m.index + m[0].length, raw: m[0] });
  }
  return out;
}
function parseAmount(text) { const a = findAmounts(text); return a.length ? a[0].value : null; }
const CAT_WORDS = [
  ['food', 'swiggy|zomato|eatsure|pizza|dominos|burger|kfc|mcd|biryani|food|lunch|dinner|order|delivery'],
  ['chai', 'chai|tea|coffee|cafe|starbucks|chaayos|barista|ccd'],
  ['ride', 'auto|cab|uber|ola|rapido|metro|petrol|fuel|bus|train'],
  ['shop', 'blinkit|zepto|instamart|amazon|flipkart|myntra|ajio|nykaa|meesho|shoes|shirt|kurta|shopping|clothes'],
];
function guessCat(text) {
  for (const [c, words] of CAT_WORDS) if (new RegExp('\\b(?:' + words + ')\\b', 'i').test(text)) return c;
  return 'other';
}
const FILLER = /\b(spent|spend|paid|pay|gave|give|sent|send|bought|buy|for|on|to|ko|rs|rupees|rupee|inr|just|only|a|an|the|my|me|i|ka|ki|ke|kal|aaj|yesterday|today|parso|of|at|from|last|ago|please|pls)\b|₹/ig;
function noteFrom(seg) {
  let t = seg.replace(AMT_RE, ' ').replace(FILLER, ' ').replace(/\b(mon|tues?|wed(nes)?|thu(rs)?|fri|sat(ur)?|sun)(day)?\b/ig, ' ');
  t = t.replace(/[^\p{L}\p{N}\s-]/gu, ' ').replace(/\s+/g, ' ').trim();
  return t.split(' ').slice(0, 4).join(' ');
}
const WORD_NUM = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, ek: 1, do: 2, teen: 3, char: 4, paanch: 5, a: 1, couple: 2 };
function parseCount(text) {
  const m = text.match(/\b(\d+(?:\.\d+)?|one|two|three|four|five|six|seven|eight|nine|ten|ek|teen|char|paanch|a couple of)\s*(day|days|din|week|weeks|hafta|haftey|month|months)\b/i);
  if (!m) return null;
  const n = isNaN(m[1]) ? (WORD_NUM[m[1].toLowerCase().replace('a couple of', 'couple')] || 1) : parseFloat(m[1]);
  const unit = m[2].toLowerCase();
  const mult = /^(week|hafta)/.test(unit) ? 7 : /^month/.test(unit) ? 30 : 1;
  return { n, days: Math.round(n * mult) };
}
// returns a day key or null if the message names no date
function parseWhen(text, today) {
  const t = text.toLowerCase();
  if (/\b(parso|day before yesterday)\b/.test(t)) return addDays(today, -2);
  if (/\b(kal|yesterday)\b/.test(t)) return addDays(today, -1);
  if (/\b(aaj|today)\b/.test(t)) return today;
  const wd = t.match(/\blast\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
  if (wd) { const target = WEEKDAYS.indexOf(wd[1]); const delta = ((dow(today) - target + 7) % 7) || 7; return addDays(today, -delta); }
  const dm = t.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/);
  if (dm) {
    const mi = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'].indexOf(dm[2]);
    let y = +today.slice(0, 4); let k = `${y}-${String(mi + 1).padStart(2, '0')}-${String(+dm[1]).padStart(2, '0')}`;
    if (k > today) k = `${y - 1}-${k.slice(5)}`;
    return k;
  }
  return null;
}
// the prototype's route(): the basic parser used as fallback when the AI is down
function route(text) {
  const t = text.toLowerCase().trim();
  if (/\b(undo|delete last|oops)\b/.test(t)) return { intent: 'undo' };
  if (/\breset\b/.test(t)) return { intent: 'reset' };
  if (/\b(set|change|new)\b.*\bgoal\b/.test(t)) return { intent: 'goal' };
  if (/how am i doing|on track|status/.test(t)) return { intent: 'status' };
  const amount = parseAmount(t);
  if (amount != null && amount > 0 && (/\?|can i|should i|afford|worth it/.test(t))) return { intent: 'check', amount, label: noteFrom(text) };
  if (amount != null && amount > 0) return { intent: 'spend', amount, category: guessCat(t), note: noteFrom(text) || guessCat(t) };
  return { intent: 'help' };
}

// ---------- queries over a list of spends [{amount, category, dk}] ----------
const inRange = (x, from, to) => x.dk >= from && x.dk <= to;
function totalIn(spends, from, to, cat) { return spends.reduce((a, x) => inRange(x, from, to) && (!cat || x.category === cat) ? a + x.amount : a, 0); }
function breakdown(spends, from, to) {
  const m = {};
  spends.forEach(x => { if (inRange(x, from, to)) { m[x.category] = m[x.category] || { category: x.category, total: 0, count: 0 }; m[x.category].total += x.amount; m[x.category].count++; } });
  return Object.values(m).sort((a, b) => b.total - a.total);
}
function comparePeriods(spends, aFrom, aTo, bFrom, bTo) {
  const A = breakdown(spends, aFrom, aTo), B = breakdown(spends, bFrom, bTo);
  const cats = new Set([...A.map(x => x.category), ...B.map(x => x.category)]);
  const rows = [...cats].map(c => {
    const a = (A.find(x => x.category === c) || { total: 0 }).total, b = (B.find(x => x.category === c) || { total: 0 }).total;
    return { category: c, a, b, diff: a - b };
  }).sort((x, y) => y.diff - x.diff);
  const ta = rows.reduce((s, r) => s + r.a, 0), tb = rows.reduce((s, r) => s + r.b, 0);
  return { rows, totalA: ta, totalB: tb, diff: ta - tb, biggestGrowth: rows.length && rows[0].diff > 0 ? rows[0] : null, biggestDrop: rows.length && rows[rows.length - 1].diff < 0 ? rows[rows.length - 1] : null };
}
// what-if: kind = cut_category | extra_saving | one_off_spend
function whatIf(s, d, kind, p) {
  const today = s.today;
  let delta = 0, assumption = '';
  if (kind === 'cut_category') {
    const rate = totalIn(s.spends, addDays(today, -27), today, p.category) / 28;
    delta = rate * p.days; assumption = `Your ${p.category} run-rate over the last 28 days is ${fmtINR(rate)}/day, so skipping it for ${p.days} days keeps about ${fmtINR(delta)}.`;
  } else if (kind === 'extra_saving') {
    delta = p.amount; assumption = `Saving ${fmtINR(p.amount)} more each month.`;
  } else if (kind === 'one_off_spend') {
    delta = -p.amount; assumption = `A one-off spend of ${fmtINR(p.amount)}.`;
  }
  const save2 = d.projSave + delta;

// ==AUNTY== the Aunty engine. In production an LLM (Claude) sits where planPlan() sits below.
// Everything around it is the real design: system prompt, CONTEXT block, tools with validation, the tool loop (max 6
// rounds), mood tag, guardrails (numbers, regional words, advice, length), repair-then-template, AI-down fallback.
// The mock "model" picks tools and writes in Aunty's voice from the tool results, so the whole pipeline can be tested offline.
const SYSTEM_PROMPT = `You are Hisaab Aunty, a warm, slightly cheeky money aunty for young people in India.

VOICE
- Short replies: one to three sentences (up to six when the user asks for an explanation or comparison, 150 words max). Mostly plain English with a light touch of the user's regional language (see REGION), in Roman letters. Never more than two regional words per reply; the sentence must still make sense without them. Be witty and quirky: one small joke per reply, about the habit, never the person.
- Tease gently about overspending. Never shame, never scold. If the user is over budget, be kind first and practical second.
- No jokes for a spend over 3 times the daily budget, or when the user mentions an emergency, hospital, rent being short, or sounds upset. Be calm and kind.
- Use the rupee sign and Indian digit grouping, for example 1,25,000.

REGION
- CONTEXT gives region_flavour and the approved words. Use only those words. If it is none, write plain English.
- Never stereotype a region, its food or its people.

TRUTH ABOUT MONEY
- You cannot do arithmetic reliably, so you never do it. Every rupee figure must come from a tool result, the CONTEXT block, or the user's own message. If you need a figure you do not have, call a tool.
- To save a spend call log_spend (once per spend). To answer "can I buy this" call check_purchase. For numbers about spending call get_summary, query_spends, category_breakdown, compare_periods, what_if, get_goal_details, get_streak, get_latest_recap or get_recent_nudges. To remove the last spend call undo_last_spend. Never say you saved or removed something unless the tool succeeded.
- If the amount or what it was for is unclear, ask ONE short question and call no tool.
- Goals are optional and there can be several. If the user wants to add, set or change a goal, reply with exactly: [goal_setup]. Without goals you are a daily budgeting coach: income minus bills, spread over the days of the month.

const SLM_PROMPT = `You turn one message from a budgeting-app user into a JSON intent. The user writes English, Hindi in Roman letters, or a mix, with typos.

- log_spend: {"intent":"log_spend","spends":[{"amount_inr":number,"category":string,"note":string,"when":"YYYY-MM-DD or omit"}]}
- check_purchase: {"intent":"check_purchase","amount_inr":number,"label":string}
- status: {"intent":"status","period":"today|week|month|goal"}
- undo: {"intent":"undo"}
- query: {"intent":"query","mode":"total|biggest|list","period":"today|yesterday|this week|last week|this month|last month","category":string or omit}
- compare: {"intent":"compare","period":"week|month"}
- goal_info, accounts, limits, streak, recap: {"intent":"<name>"}
- ask: {"intent":"ask","question":"one short clarifying question"} when an amount or detail is missing or unclear

}

  <h3>Try a message (shows the proposal and what would run; nothing is executed or saved)</h3>
  <div class="ctl"><input id="llmMsg" style="flex:1" placeholder="e.g. pichle hafte se is hafte kitna zyada gaya" value="pichle hafte se is hafte kitna zyada gaya"><button class="dbtn" data-dact="llm-try">Interpret</button></div>

node llm-proxy.js        # refuses to start without LLM_API_KEY</pre>
